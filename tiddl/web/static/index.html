<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tiddl-ui</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="tiddl-ui home">
      <span class="brand-mark"><i data-lucide="audio-lines"></i></span>
      <span>tiddl-ui</span>
    </a>
    <div class="top-actions">
      <a class="icon-button bordered" href="/player" aria-label="Player" title="Player"><i data-lucide="circle-play"></i></a>
      <label class="language-control" aria-label="Interface language">
        <i data-lucide="languages"></i>
        <select id="languageSelect">
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <button id="themeButton" class="icon-button bordered" type="button" aria-label="Switch color theme" title="Switch color theme"><i data-lucide="sun"></i></button>
      <button id="authButton" class="button button-secondary" type="button"><i data-lucide="log-in"></i><span>Sign in</span></button>
    </div>
  </header>

  <main class="shell">
    <section class="workspace" aria-label="New download">
      <div class="workspace-meta">
        <div id="systemFacts" class="system-facts"></div>
      </div>

      <form id="downloadForm" class="download-form">
        <div class="field resource-field">
          <div class="resource-label-row">
            <label for="urls" data-i18n="resourceLabel">Search Tidal or add links</label>
            <div class="resource-actions">
              <button id="advancedButton" class="icon-button bordered" type="button" title="Advanced" aria-label="Advanced">
                <i data-lucide="sliders-horizontal"></i>
              </button>
              <button class="icon-button download-icon-button" type="submit" title="Start download" aria-label="Start download">
                <i data-lucide="download"></i>
              </button>
            </div>
          </div>
          <div class="resource-input">
            <textarea id="urls" rows="1" placeholder="Search tracks and albums, or paste a Tidal link"></textarea>
            <section id="previewPanel" class="preview-panel" hidden aria-live="polite"></section>
            <section id="searchResults" class="search-results" hidden aria-live="polite"></section>
          </div>
        </div>
        <div id="formMessage" class="form-message" role="status"></div>
      </form>
    </section>

    <aside class="activity" aria-labelledby="activityHeading">
      <div class="activity-header">
        <div>
          <h2 id="activityHeading" data-i18n="activity">Activity</h2>
        </div>
        <button id="refreshButton" class="icon-button" type="button" title="Refresh tasks" aria-label="Refresh tasks"><i data-lucide="refresh-cw"></i></button>
      </div>
      <div id="jobList" class="job-list"></div>
      <div id="emptyState" class="empty-state">
        <i data-lucide="list-music"></i>
        <p data-i18n="noDownloads">No downloads yet</p>
        <span data-i18n="emptyHint">Your active and recent tasks will appear here.</span>
      </div>
    </aside>
  </main>

  <dialog id="advancedDialog" class="advanced-dialog">
    <div class="dialog-head">
      <h2 data-i18n="advanced">Advanced</h2>
      <button class="icon-button" data-close-advanced type="button" aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <div class="advanced-grid">
      <label class="field">
        <span data-i18n="downloadFolder">Download folder</span>
        <input id="downloadPath" type="text" placeholder="~/Music/tiddl">
      </label>
      <label class="field">
        <span data-i18n="outputTemplate">Output template</span>
        <input id="outputTemplate" type="text" placeholder="{album.artist}/{album.title}/{item.title}">
      </label>
      <label class="field compact-field">
        <span data-i18n="concurrentDownloads">Concurrent downloads</span>
        <input id="threads" type="number" value="4" min="1" max="16">
      </label>
      <div class="advanced-toggles">
        <label class="toggle-field">
          <input id="skipExisting" type="checkbox" checked><span class="toggle"></span><span data-i18n="skipExisting">Skip existing files</span>
        </label>
        <label class="toggle-field">
          <input id="defaultVideos" type="checkbox"><span class="toggle"></span><span data-i18n="defaultVideos">Download videos by default</span>
        </label>
        <label class="toggle-field">
          <input id="defaultHighest" type="checkbox"><span class="toggle"></span><span data-i18n="defaultHighest">Use highest quality by default</span>
        </label>
        <label class="toggle-field">
          <input id="defaultAtmos" type="checkbox"><span class="toggle"></span><span data-i18n="defaultAtmos">Enable Atmos by default</span>
        </label>
      </div>
    </div>
  </dialog>

  <dialog id="authDialog">
    <div class="dialog-head">
      <div>
        <p class="eyebrow" data-i18n="tidalAccount">Tidal accounts</p>
        <h2 data-i18n="connectAccount">Account group</h2>
      </div>
      <button class="icon-button" data-close-dialog type="button" aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <div id="authContent" class="dialog-content"></div>
  </dialog>

  <dialog id="logDialog" class="log-dialog">
    <div class="dialog-head">
      <h2 id="logTitle" data-i18n="taskDetails">Task details</h2>
      <button class="icon-button" data-close-log type="button" aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <pre id="logOutput"></pre>
  </dialog>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
