<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0b0c0e"/>
  <!-- 核糖（β-D-ribofuranose）平面球棍模型：五元呋喃环 + 环内氧 + 四个羟基氧，单色品牌绿 -->
  <g fill="none" stroke="#36e0a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 呋喃环（顶点为环内氧） -->
    <path d="M32 19 L44.4 28 L39.6 42.5 L24.4 42.5 L19.6 28 Z"/>
    <!-- C1'–C4' 羟基键 -->
    <path d="M44.4 28 L51 25.9 M39.6 42.5 L43.8 48.2 M24.4 42.5 L20.2 48.2 M19.6 28 L13 25.9"/>
  </g>
  <!-- 环上碳原子 -->
  <circle cx="44.4" cy="28" r="4.2" fill="#36e0a1"/>
  <circle cx="39.6" cy="42.5" r="4.2" fill="#36e0a1"/>
  <circle cx="24.4" cy="42.5" r="4.2" fill="#36e0a1"/>
  <circle cx="19.6" cy="28" r="4.2" fill="#36e0a1"/>
  <!-- 羟基氧 -->
  <circle cx="51" cy="25.9" r="3" fill="#36e0a1"/>
  <circle cx="43.8" cy="48.2" r="3" fill="#36e0a1"/>
  <circle cx="20.2" cy="48.2" r="3" fill="#36e0a1"/>
  <circle cx="13" cy="25.9" r="3" fill="#36e0a1"/>
  <!-- 环内氧（以更大的尺寸作视觉焦点） -->
  <circle cx="32" cy="19" r="5.2" fill="#36e0a1"/>
</svg>
